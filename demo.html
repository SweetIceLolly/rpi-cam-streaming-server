<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <script>
        function $(id){
            return document.getElementById(id)
        }

        window.onload = function(){
            // Connect to our server:
            let ws = new WebSocket("ws://128.189.92.96:8000/");
            ws.binaryType = "blob";

            let currentUrl = null;

            // This will run when data comes through the WebSocket:
            ws.onmessage = function (event) {
                // Revoke previous URL to prevent memory leaks
                if (currentUrl) {
                    URL.revokeObjectURL(currentUrl);
                }
                // Create blob URL directly from binary data
                currentUrl = URL.createObjectURL(event.data);
                $("stream").src = currentUrl;
            }
        }
    </script>
    <style>
        body {
            background-image: element("#stream"); /* Set body background to streamed element */
        }
    </style>
</head>
<body>
    <img src="" id="stream" class="bgimg">
</body>
</html>
