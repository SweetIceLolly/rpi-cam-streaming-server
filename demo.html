<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <script>
        function $(id){
            return document.getElementById(id)
        }

        let ws = null;
        let currentUrl = null;

        function connect() {
            const address = $("serverIp").value;
            const status = $("status");

            if (ws) {
                ws.close();
            }

            status.textContent = "Connecting...";

            // Connect to our server:
            ws = new WebSocket(address);
            ws.binaryType = "blob";

            ws.onopen = function() {
                status.textContent = "Connected";
            };

            ws.onclose = function() {
                status.textContent = "Disconnected";
            };

            ws.onerror = function() {
                status.textContent = "Error";
            };

            // This will run when data comes through the WebSocket:
            ws.onmessage = function (event) {
                // Revoke previous URL to prevent memory leaks
                if (currentUrl) {
                    URL.revokeObjectURL(currentUrl);
                }
                // Create blob URL directly from binary data
                currentUrl = URL.createObjectURL(event.data);
                $("stream").src = currentUrl;
            }
        }

        function updateSettings() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert("Not connected");
                return;
            }
            
            const width = parseInt($("width").value);
            const height = parseInt($("height").value);
            const quality = parseInt($("quality").value);
            
            const payload = {
                width: width,
                height: height,
                quality: quality
            };
            
            ws.send(JSON.stringify(payload));
        }
    </script>
    <style>
        body {
            background-image: element("#stream"); /* Set body background to streamed element */
        }
    </style>
</head>
<body>
    <div style="margin-bottom: 10px;">
        <input type="text" id="serverIp" value="ws://128.189.92.96:8000/" style="width: 300px;">
        <button onclick="connect()">Connect</button>
        <span id="status">Disconnected</span>
    </div>
    <div style="margin-bottom: 10px;">
        <label>Width: <input type="number" id="width" value="640"></label>
        <label>Height: <input type="number" id="height" value="480"></label>
        <label>Quality: <input type="number" id="quality" value="70"></label>
        <button onclick="updateSettings()">Update Settings</button>
    </div>
    <img src="" id="stream" class="bgimg">
</body>
</html>
