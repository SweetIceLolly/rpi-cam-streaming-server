<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <script>
        function $(id){
            return document.getElementById(id)
        }

        let ws = null;
        let currentUrl = null;
        let encryptionKey = null;
        let bytesReceived = 0;
        let lastBytesReceived = 0;
        let lastSpeedUpdate = Date.now();
        let speedUpdateInterval = null;

        async function deriveKey(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            return await crypto.subtle.importKey(
                'raw',
                hashBuffer,
                { name: 'AES-GCM' },
                false,
                ['decrypt']
            );
        }

        async function decryptData(encryptedBuffer) {
            const data = new Uint8Array(encryptedBuffer);
            const nonce = data.slice(0, 12);
            const ciphertext = data.slice(12);
            
            try {
                const decrypted = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: nonce },
                    encryptionKey,
                    ciphertext
                );
                return decrypted;
            } catch (e) {
                console.error('Decryption failed:', e);
                return null;
            }
        }

        async function connect() {
            const address = $("serverIp").value;
            const password = $("password").value;
            const status = $("status");

            if (!password) {
                alert("Please enter the decryption password");
                return;
            }

            // Derive encryption key from password
            encryptionKey = await deriveKey(password);

            if (ws) {
                ws.close();
            }

            status.textContent = "Connecting...";

            // Connect to our server:
            ws = new WebSocket(address);
            ws.binaryType = "blob";

            ws.onopen = function() {
                status.textContent = "Connected - 0 KB/s";
                bytesReceived = 0;
                lastBytesReceived = 0;
                lastSpeedUpdate = Date.now();
                // Update speed display every second
                speedUpdateInterval = setInterval(() => {
                    const now = Date.now();
                    const elapsed = (now - lastSpeedUpdate) / 1000;
                    const bytesDiff = bytesReceived - lastBytesReceived;
                    const speed = bytesDiff / elapsed;
                    let speedText;
                    if (speed >= 1024 * 1024) {
                        speedText = (speed / (1024 * 1024)).toFixed(2) + " MB/s";
                    } else {
                        speedText = (speed / 1024).toFixed(2) + " KB/s";
                    }
                    status.textContent = "Connected - " + speedText;
                    lastBytesReceived = bytesReceived;
                    lastSpeedUpdate = now;
                }, 1000);
            };

            ws.onclose = function() {
                status.textContent = "Disconnected";
                if (speedUpdateInterval) {
                    clearInterval(speedUpdateInterval);
                    speedUpdateInterval = null;
                }
            };

            ws.onerror = function() {
                status.textContent = "Error";
            };

            // This will run when data comes through the WebSocket:
            ws.onmessage = async function (event) {
                const encryptedData = await event.data.arrayBuffer();
                bytesReceived += encryptedData.byteLength;
                const decryptedData = await decryptData(encryptedData);
                
                if (decryptedData) {
                    // Revoke previous URL to prevent memory leaks
                    if (currentUrl) {
                        URL.revokeObjectURL(currentUrl);
                    }
                    // Create blob URL from decrypted data
                    const blob = new Blob([decryptedData], { type: 'image/jpeg' });
                    currentUrl = URL.createObjectURL(blob);
                    $("stream").src = currentUrl;
                }
            }
        }

        function updateSettings() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert("Not connected");
                return;
            }
            
            const width = parseInt($("width").value);
            const height = parseInt($("height").value);
            const quality = parseInt($("quality").value);
            
            const payload = {
                width: width,
                height: height,
                quality: quality
            };
            
            ws.send(JSON.stringify(payload));
        }
    </script>
    <style>
        body {
            background-image: element("#stream"); /* Set body background to streamed element */
        }
    </style>
</head>
<body>
    <div style="margin-bottom: 10px;">
        <input type="text" id="serverIp" value="wss://128.189.92.96:8000/" style="width: 300px;">
        <input type="password" id="password" placeholder="Decryption Password" style="width: 150px;">
        <button onclick="connect()">Connect</button>
        <span id="status">Disconnected</span>
    </div>
    <div style="margin-bottom: 10px;">
        <label>Width: <input type="number" id="width" value="640"></label>
        <label>Height: <input type="number" id="height" value="480"></label>
        <label>Quality: <input type="number" id="quality" value="70"></label>
        <button onclick="updateSettings()">Update Settings</button>
    </div>
    <img src="" id="stream" class="bgimg">
</body>
</html>
