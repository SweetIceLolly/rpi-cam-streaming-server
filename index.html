<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <script>
        function $(id){
            return document.getElementById(id)
        }

        let ws = null;
        let currentUrl = null;
        let encryptionKey = null;
        let bytesReceived = 0;
        let lastBytesReceived = 0;
        let lastSpeedUpdate = Date.now();
        let speedUpdateInterval = null;

        const STORAGE_KEY = 'fpv-stream-settings';

        function saveSettings() {
            const settings = {
                serverUrl: $("serverIp").value,
                width: $("width").value,
                height: $("height").value,
                quality: $("quality").value
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
        }

        function loadSettings() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const settings = JSON.parse(saved);
                    if (settings.serverUrl) $("serverIp").value = settings.serverUrl;
                    if (settings.width) $("width").value = settings.width;
                    if (settings.height) $("height").value = settings.height;
                    if (settings.quality) $("quality").value = settings.quality;
                } catch (e) {
                    console.error('Failed to load settings:', e);
                }
            }
        }

        async function deriveKey(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            return await crypto.subtle.importKey(
                'raw',
                hashBuffer,
                { name: 'AES-GCM' },
                false,
                ['decrypt']
            );
        }

        async function decryptData(encryptedBuffer) {
            const data = new Uint8Array(encryptedBuffer);
            const nonce = data.slice(0, 12);
            const ciphertext = data.slice(12);
            
            try {
                const decrypted = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: nonce },
                    encryptionKey,
                    ciphertext
                );
                return decrypted;
            } catch (e) {
                console.error('Decryption failed:', e);
                return null;
            }
        }

        async function connect() {
            const address = $("serverIp").value;
            const password = $("password").value;
            const status = $("status");

            if (!password) {
                alert("Please enter the decryption password");
                return;
            }

            // Save settings when connecting
            saveSettings();

            // Derive encryption key from password
            encryptionKey = await deriveKey(password);

            if (ws) {
                ws.close();
            }

            status.textContent = "Connecting...";

            // Connect to our server:
            ws = new WebSocket(address);
            ws.binaryType = "blob";

            ws.onopen = function() {
                status.textContent = "Authenticating...";
                // Send access password for authentication
                const accessPassword = $("accessPassword").value;
                ws.send(JSON.stringify({ access_password: accessPassword }));
            };

            ws.onclose = function() {
                status.textContent = "Disconnected";
                if (speedUpdateInterval) {
                    clearInterval(speedUpdateInterval);
                    speedUpdateInterval = null;
                }
            };

            ws.onerror = function() {
                status.textContent = "Error";
            };

            let authenticated = false;

            // This will run when data comes through the WebSocket:
            ws.onmessage = async function (event) {
                // Check if this is an authentication response (JSON text)
                if (!authenticated && typeof event.data === 'string') {
                    try {
                        const response = JSON.parse(event.data);
                        if (response.authenticated === true) {
                            authenticated = true;
                            status.textContent = "Connected - 0 KB/s";
                            bytesReceived = 0;
                            lastBytesReceived = 0;
                            lastSpeedUpdate = Date.now();
                            // Update speed display every second
                            speedUpdateInterval = setInterval(() => {
                                const now = Date.now();
                                const elapsed = (now - lastSpeedUpdate) / 1000;
                                const bytesDiff = bytesReceived - lastBytesReceived;
                                const speed = bytesDiff / elapsed;
                                let speedText;
                                if (speed >= 1024 * 1024) {
                                    speedText = (speed / (1024 * 1024)).toFixed(2) + " MB/s";
                                } else {
                                    speedText = (speed / 1024).toFixed(2) + " KB/s";
                                }
                                status.textContent = "Connected - " + speedText;
                                lastBytesReceived = bytesReceived;
                                lastSpeedUpdate = now;
                            }, 1000);
                        } else {
                            status.textContent = "Authentication failed: " + (response.error || "Unknown error");
                            ws.close();
                        }
                        return;
                    } catch (e) {
                        // Not JSON, might be binary data
                    }
                }

                if (!authenticated) {
                    return;
                }

                // Check if this is a viewers list response (JSON text)
                if (typeof event.data === 'string') {
                    try {
                        const response = JSON.parse(event.data);
                        if (response.viewers) {
                            displayViewers(response.viewers);
                            return;
                        }
                        if (response.access_log) {
                            displayAccessLog(response.access_log);
                            return;
                        }
                    } catch (e) {
                        // Not JSON, continue
                    }
                }

                const encryptedData = await event.data.arrayBuffer();
                bytesReceived += encryptedData.byteLength;
                const decryptedData = await decryptData(encryptedData);
                
                if (decryptedData) {
                    // Revoke previous URL to prevent memory leaks
                    if (currentUrl) {
                        URL.revokeObjectURL(currentUrl);
                    }
                    // Create blob URL from decrypted data
                    const blob = new Blob([decryptedData], { type: 'image/jpeg' });
                    currentUrl = URL.createObjectURL(blob);
                    $("stream").src = currentUrl;
                }
            }
        }

        function updateSettings() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert("Not connected");
                return;
            }
            
            const width = parseInt($("width").value);
            const height = parseInt($("height").value);
            const quality = parseInt($("quality").value);
            
            const payload = {
                width: width,
                height: height,
                quality: quality
            };
            
            ws.send(JSON.stringify(payload));
            
            // Save settings when updating
            saveSettings();
        }

        function getViewers() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert("Not connected");
                return;
            }
            ws.send(JSON.stringify({ get_viewers: true }));
        }

        function displayViewers(viewers) {
            const viewersList = $("viewersList");
            if (viewers.length === 0) {
                viewersList.innerHTML = "<em>No active viewers</em>";
            } else {
                let html = "<strong>Active Viewers (" + viewers.length + "):</strong><ul>";
                viewers.forEach(v => {
                    html += "<li>ID: " + v.id + " | Connected: " + v.connected_at + " | Address: " + v.remote_address + "</li>";
                });
                html += "</ul>";
                viewersList.innerHTML = html;
            }
        }

        function getAccessLog() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert("Not connected");
                return;
            }
            ws.send(JSON.stringify({ get_access_log: true }));
        }

        function displayAccessLog(log) {
            const accessLogDiv = $("accessLog");
            if (log.length === 0) {
                accessLogDiv.innerHTML = "<em>No access log entries</em>";
            } else {
                let html = "<strong>Access Log (" + log.length + " entries):</strong><ul>";
                // Show most recent first
                for (let i = log.length - 1; i >= 0; i--) {
                    const entry = log[i];
                    const status = entry.success ? '<span style="color: green;">SUCCESS</span>' : '<span style="color: red;">FAILED</span>';
                    const errorMsg = entry.error ? " - " + entry.error : "";
                    html += "<li>" + entry.timestamp + " | " + entry.remote_address + " | " + status + errorMsg + "</li>";
                }
                html += "</ul>";
                accessLogDiv.innerHTML = html;
            }
        }

        // Load settings when page loads
        window.addEventListener('DOMContentLoaded', loadSettings);
    </script>
    <style>
        body {
            background-image: element("#stream"); /* Set body background to streamed element */
        }
    </style>
</head>
<body>
    <div style="margin-bottom: 10px;">
        <input type="text" id="serverIp" value="wss://128.189.92.96:8000/" style="width: 300px;">
        <input type="password" id="password" placeholder="Decryption Password" style="width: 150px;">
        <input type="password" id="accessPassword" placeholder="Access Password" style="width: 150px;">
        <button onclick="connect()">Connect</button>
        <span id="status">Disconnected</span>
    </div>
    <div style="margin-bottom: 10px;">
        <label>Width: <input type="number" id="width" value="640"></label>
        <label>Height: <input type="number" id="height" value="480"></label>
        <label>Quality: <input type="number" id="quality" value="70"></label>
        <button onclick="updateSettings()">Update Settings</button>
        <button onclick="getViewers()">Get Active Viewers</button>
        <button onclick="getAccessLog()">Get Access Log</button>
    </div>
    <div id="viewersList" style="margin-bottom: 10px;"></div>
    <div id="accessLog" style="margin-bottom: 10px;"></div>
    <img src="" id="stream" class="bgimg">
</body>
</html>
